name: Test

on:
  push:
    branches:
      - main
      - "beta/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: Run tests
        run: |
          npm ci
          npm test
